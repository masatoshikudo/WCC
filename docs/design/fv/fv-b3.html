<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FV確定版｜文字の間に動画（シルバー）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Sans+JP:wght@400;500;700&family=Plus+Jakarta+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#f9f4f1; --ink:#202620; --heading:#000; --muted:#525252; --subtle:#a3a3a3;
  --hairline:#e5e5e5; --accent:#ca5311; --accent-hover:#b84a0f; --on-accent:#fff;
  --dark:#000; --on-dark:#fff; --footer-muted:#7a6e6e;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#c8c9cc}
body{color:var(--ink);min-height:100svh;background:linear-gradient(160deg,#e6e7e9 0%,#d2d3d6 38%,#c1c2c6 62%,#d9dadc 100%) fixed}
body{font-family:"Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

.hdr{position:fixed;inset:0 0 auto;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:64px;padding:0 16px}
.chip{justify-self:start;font:500 12px "Plus Jakarta Sans",sans-serif;letter-spacing:.04em;height:30px;padding:0 14px;border-radius:999px;
  background:rgba(255,255,255,.55);display:inline-flex;align-items:center;gap:8px;color:var(--ink)}
.chip b{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.logo{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:18px;letter-spacing:.04em;color:var(--heading)}
.icons{justify-self:end;display:flex;gap:6px}
.icons a{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.55);display:grid;place-items:center}
.icons svg{width:14px;height:14px;fill:var(--ink)}

.hero{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:96px 12px 56px;text-align:center}
.big{font-family:"Cormorant Garamond",serif;font-weight:400;color:var(--heading);
  font-size:clamp(3.4rem,13.2vw,12.5rem);line-height:.98;letter-spacing:-.035em}
.row{display:flex;justify-content:center;align-items:center;flex-wrap:nowrap;white-space:nowrap}
.row+.row{margin-top:.04em}
.w{display:inline-block;opacity:0;transform:translateY(.25em);animation:in 1s cubic-bezier(.2,.7,.1,1) forwards}
.w.d1{animation-delay:.1s}.w.d2{animation-delay:.25s}.w.d3{animation-delay:.4s}.w.d4{animation-delay:.55s}
em{font-style:italic}
/* 文字の間の動画ピル：幅0から開く */
.pill{display:inline-block;height:.78em;width:0;margin:0 .06em;border-radius:999px;overflow:hidden;vertical-align:middle;position:relative;
  animation:open 1.2s .9s cubic-bezier(.7,0,.2,1) forwards;background:#b9babe}
.pill.p2{animation-delay:1.1s}
.pill video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
@keyframes open{to{width:1.55em;margin:0 .14em}}
@keyframes in{to{opacity:1;transform:none}}

.sub{margin-top:clamp(28px,5vh,48px);display:flex;flex-direction:column;align-items:center;gap:22px;opacity:0;animation:in 1s 1.5s forwards}
.sub h1{font-weight:500;font-size:clamp(1.05rem,1.6vw,1.35rem);letter-spacing:.12em;color:var(--ink)}
.cta{display:inline-flex;align-items:center;gap:10px;font:600 14px "Plus Jakarta Sans","Noto Sans JP",sans-serif;letter-spacing:.06em;
  height:52px;padding:0 28px;border-radius:999px;background:var(--accent);color:var(--on-accent);transition:background .2s}
.cta:hover{background:var(--accent-hover)}
.cta svg{width:14px;height:14px}
.link{font-size:13px;color:var(--ink);border-bottom:1px solid var(--muted);padding-bottom:2px}


@media (max-width:640px){
  .chip span{display:none}.chip{padding:0 10px}
  .logo{font-size:15px}
  .hero{padding:80px 8px 40px}
  .big{font-size:27vw;line-height:.9;letter-spacing:-.045em}
  .row{flex-wrap:wrap}
  .row .w.d2,.row.split .w.d3{flex-basis:100%}
  .pill,.pill.p2{animation-name:open-sp}
  @keyframes open-sp{to{width:1.45em;margin:0 .1em}}
  .sub{margin-top:28px;gap:18px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important}
  .w,.sub{opacity:1;transform:none}.pill{width:1.55em;margin:0 .14em}
}
</style>
</head>
<body>
<header class="hdr">
  <a class="chip" href="#"><b></b><span>Menu</span></a>
  <a class="logo" href="#">For Your Wedding Day</a>
  <nav class="icons">
    <a href="#" aria-label="Instagram"><svg viewBox="0 0 24 24"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm0 8.2A3.2 3.2 0 1 1 12 8.8a3.2 3.2 0 0 1 0 6.4ZM17.3 5.5a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4ZM12 2c-2.7 0-3 0-4.1.1C4.3 2.3 2.3 4.3 2.1 7.9 2 9 2 9.3 2 12s0 3 .1 4.1c.2 3.6 2.2 5.6 5.8 5.8 1.1.1 1.4.1 4.1.1s3 0 4.1-.1c3.6-.2 5.6-2.2 5.8-5.8.1-1.1.1-1.4.1-4.1s0-3-.1-4.1c-.2-3.6-2.2-5.6-5.8-5.8C15 2 14.7 2 12 2Zm0 1.8c2.7 0 3 0 4 .1 2.6.1 3.9 1.4 4 4 .1 1 .1 1.3.1 4s0 3-.1 4c-.1 2.6-1.4 3.9-4 4-1 .1-1.3.1-4 .1s-3 0-4-.1c-2.6-.1-3.9-1.4-4-4-.1-1-.1-1.3-.1-4s0-3 .1-4c.1-2.6 1.4-3.9 4-4 1-.1 1.3-.1 4-.1Z"/></svg></a>
    <a href="#" aria-label="お問い合わせ"><svg viewBox="0 0 24 24"><path d="M3 5h18v14H3V5Zm2 2v.5l7 4.6 7-4.6V7H5Zm14 2.9-7 4.6-7-4.6V17h14V9.9Z"/></svg></a>
  </nav>
</header>

<main class="hero">
  <div class="big" aria-label="For your wedding day">
    <div class="row">
      <span class="w d1">For</span>
      <span class="pill"><video src="../../../site/public/videos/WC_movie_sample_1.mp4" poster="../../../site/public/images/highlight-posters/wc-sample-1.jpg" muted loop playsinline autoplay preload="metadata"></video></span>
      <span class="w d2"><em>your</em></span>
    </div>
    <div class="row split">
      <span class="w d3">wedding</span>
      <span class="pill p2"><video src="../../../site/public/videos/WC_movie_sample_4.mp4" poster="../../../site/public/images/highlight-posters/wc-sample-4.jpg" muted loop playsinline autoplay preload="metadata"></video></span>
      <span class="w d4">day</span>
    </div>
  </div>

  <div class="sub">
    <h1 lang="ja">明日のふたりへ</h1>
    <a class="cta" href="#">まず相談する
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 8h10M9 4l4 4-4 4"/></svg></a>
    <a class="link" href="#">作例を見る</a>
  </div>
</main>

</body>
</html>
